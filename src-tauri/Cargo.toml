[package]
name = "my-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "my-app"
path = "src/main.rs"

[package.metadata.tauri-winres]
# Windows EXE 文件属性（右键 → 属性 → 详细信息）
# 文件版本 和 产品版本 由 tauri.conf.json 的 version 自动同步
FileDescription = "我的应用"
ProductName = "我的应用"
CompanyName = "My Company"
LegalCopyright = "Copyright © 2026 My Company"
OriginalFilename = "my-app.exe"
InternalName = "my-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-winres = "0.3"

[dependencies]
# tray-icon：系统托盘（不需要托盘时移除该 feature，见 README「按需移除托盘」）
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
