<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的应用</title>
<style>
        :root {
            --bg: #F2F2F7;
            --bg-elevated: #FFFFFF;
            --bg-secondary: #E5E5EA;
            --label: #000000;
            --label-secondary: #3C3C43;
            --separator-opaque: #E5E5EA;
            --blue: #007AFF;
            --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--label);
            min-height: 100vh;
            padding-top: 40px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ───── 自定义标题栏 ───── */
        .titlebar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--separator-opaque);
            -webkit-app-region: drag;
            -webkit-user-select: none;
            user-select: none;
            z-index: 1000;
        }

        .titlebar-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--label-secondary);
        }

        .window-controls {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            display: flex;
            align-items: stretch;
            -webkit-app-region: no-drag;
        }

        .win-btn {
            width: 40px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: transparent;
            transition: background 0.15s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: no-drag;
            color: var(--label-secondary);
        }

        .win-btn:hover { background: var(--bg-secondary); }
        .win-btn:active { background: #C6C6C8; }

        .win-btn-close:hover { background: #E81123; color: #fff; }
        .win-btn-close:active { background: #BF0F1D; color: #fff; }

        .win-btn::after {
            content: '';
            display: block;
            opacity: 1;
            line-height: 1;
            pointer-events: none;
        }

        .win-btn-close::after {
            content: '\2715';
            font-size: 10px;
            font-weight: 400;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .win-btn-min::after {
            content: '';
            width: 10px;
            height: 1.5px;
            background: currentColor;
            border-radius: 1px;
        }

        .win-btn-max::after {
            content: '';
            width: 10px;
            height: 10px;
            border: 1.5px solid currentColor;
            border-radius: 1px;
            box-sizing: border-box;
        }

        .win-btn.maximized::after {
            width: 7px;
            height: 7px;
            border: 1.5px solid currentColor;
            border-radius: 1px;
            background: var(--bg-elevated);
            box-shadow: -2.5px 2.5px 0 0 currentColor;
            box-sizing: border-box;
        }

        /* ───── 主内容区 ───── */
        .container {
            width: 100%;
            min-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1 { font-size: 1.5rem; font-weight: 600; }
        p { color: var(--label-secondary); margin-top: 8px; font-size: 0.9rem; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="titlebar" data-tauri-drag-region>
        <span class="titlebar-title">我的应用</span>
        <div class="window-controls">
            <button class="win-btn win-btn-min" id="winMin" title="最小化"></button>
            <button class="win-btn win-btn-max" id="winMax" title="最大化"></button>
            <button class="win-btn win-btn-close" id="winClose" title="关闭"></button>
        </div>
    </div>
    <div class="container">
        <h1>Hello Tauri</h1>
        <p>在此处编写你的应用内容</p>
    </div>

    <script type="module">
    {
        // 禁用右键菜单（如需启用，删除此段）
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        const titlebar = document.querySelector('.titlebar');
        const internals = window.__TAURI_INTERNALS__;

        if (!internals) {
            // 浏览器环境：隐藏标题栏
            if (titlebar) titlebar.style.display = 'none';
            document.body.style.paddingTop = '24px';
        } else {
            // Tauri 环境：绑定窗口控制
            const invoke = (cmd) => internals.invoke(cmd);

            document.getElementById('winMin').addEventListener('click', () => {
                invoke('plugin:window|minimize');
            });
            document.getElementById('winClose').addEventListener('click', () => {
                invoke('plugin:window|close');
            });

            const maxBtn = document.getElementById('winMax');
            maxBtn.addEventListener('click', () => {
                invoke('plugin:window|toggle_maximize');
            });

            const updateMaxButton = async () => {
                try {
                    const maximized = await invoke('plugin:window|is_maximized');
                    if (maximized) {
                        maxBtn.classList.add('maximized');
                        maxBtn.title = '还原';
                    } else {
                        maxBtn.classList.remove('maximized');
                        maxBtn.title = '最大化';
                    }
                } catch { /* ignore */ }
            };

            window.addEventListener('resize', updateMaxButton);
            updateMaxButton();

            // 页面加载完成后显示窗口
            invoke('plugin:window|show');
        }
    }
    </script>
</body>
</html>
