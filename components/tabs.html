<!--
═══════════ Tab 标签页 — 自包含 demo ═══════════
来源：拷贝自 dist/index.html「UI 组件：Tab 标签页」CSS 分节 + 同名 JS 分节，
      改动请双向同步（dist/index.html 为权威源）。
依赖：设计令牌子集（已内联，完整版见 tokens.css）、fadeSlide keyframe（面板切换入场动画）。
特性：分段式胶囊标签，选中态用色块 + 字重 + 弥散阴影表达（不用下划线）；
      选中态与面板均限定在所属卡片内，同页多组 Tab 互不干扰。
用法：双击本文件即可在浏览器预览；移植时复制「组件 CSS」「组件 HTML」「组件 JS」三段，
      data-tab 属性值对应面板 id。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab 标签页 · 组件 demo</title>
    <style>
        /* ───── 设计令牌子集（拷贝自 tokens.css，勿单侧改动） ───── */
        :root {
            --bg: #fcfcfc;
            --card: #feffff;
            --hover: #e0e0e0;
            --text-primary: rgba(0, 0, 0, 0.87);
            --text-body: rgba(0, 0, 0, 0.78);
            --text-auxiliary: rgba(0, 0, 0, 0.52);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --duration-fast: 100ms;
            --duration-normal: 200ms;
            --duration-slow: 300ms;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 10px;
            --radius-sm: 6px;
            --font: "Noto Serif SC", "Source Han Serif SC", "SimSun", "宋体", serif;
        }
        [data-theme="dark"] {
            --bg: #202020;
            --card: #232323;
            --hover: #3d3d3d;
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-body: rgba(255, 255, 255, 0.6);
            --text-auxiliary: rgba(255, 255, 255, 0.4);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* ───── demo 页面骨架（非组件本体） ───── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow-card);
            max-width: 560px;
            margin: 0 auto 16px;
        }
        .card-title-sm { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
        .card-subtitle { font-size: 0.7rem; color: var(--text-auxiliary); margin-bottom: 8px; }
        .theme-btn {
            display: block;
            margin: 0 auto;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: var(--font);
            cursor: pointer;
            border: none;
            background: var(--hover);
            color: var(--text-primary);
        }

        /* ═════════════════════ 组件 CSS：Tab 标签页（拷贝自 dist/index.html） ═════════════════════ */
        .tabs {
            display: flex;
            margin-bottom: 16px;
            border-radius: var(--radius-sm);
            background: var(--hover);
            padding: 2px;
        }
        .tab {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: calc(var(--radius-sm) - 1px);
            background: transparent;
            color: var(--text-body);
            font-size: 0.78rem;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: background var(--duration-normal) var(--ease), color var(--duration-normal) var(--ease);
        }
        .tab.active {
            background: var(--card);
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: var(--shadow-card);
        }
        .tab-panel { display: none; }
        .tab-panel.active {
            display: block;
            /* 面板切换复用页面入场关键帧，更短时长体现层级差异 */
            animation: fadeSlide var(--duration-normal) var(--ease);
        }
        .tab-panel-text {
            font-size: 0.78rem;
            color: var(--text-body);
            line-height: 1.6;
        }
        /* 依赖的入场关键帧（在 dist/index.html 中位于「主布局」分节） */
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ───── 动效降级 ───── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ═════════ 组件 HTML：Tab 标签页（放在卡片内，data-tab 对应面板 id） ═════════ -->
    <div class="card">
        <h2 class="card-title-sm">Tab 标签页</h2>
        <p class="card-subtitle">页内子标签切换，选中态用色块与字重表达，不用下划线</p>
        <div class="tabs" role="tablist" aria-label="示例标签页">
            <button class="tab active" role="tab" aria-selected="true" data-tab="tab-intro">简介</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="tab-config">配置</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="tab-log">日志</button>
        </div>
        <div class="tab-panel active" id="tab-intro" role="tabpanel">
            <p class="tab-panel-text">这里是简介面板。分段式标签以胶囊色块为底，选中项通过卡片色背景、加粗字重与弥散阴影浮起，无需任何分割线。</p>
        </div>
        <div class="tab-panel" id="tab-config" role="tabpanel">
            <p class="tab-panel-text">这里是配置面板。切换时面板直接显隐，标签与内容之间依靠 16px 间距建立关联。</p>
        </div>
        <div class="tab-panel" id="tab-log" role="tabpanel">
            <p class="tab-panel-text">这里是日志面板。三个标签均带 role="tab" 与 aria-selected，对屏幕阅读器友好。</p>
        </div>
    </div>

    <button class="theme-btn" id="themeBtn">切换深色</button>

    <script>
    /* ═════════════════════ 组件 JS：Tab 标签页（拷贝自 dist/index.html） ═════════════════════ */
    {
        // 选中态与面板均限定在当前卡片内，多组 Tab 互不干扰
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const card = tab.closest('.card');
                card.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');
                card.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });
    }

    /* ───── demo 绑定（非组件本体） ───── */
    document.getElementById('themeBtn').addEventListener('click', () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
    });
    </script>
</body>
</html>
