<!--
═══════════ Button 按钮 — 自包含 demo ═══════════
来源：拷贝自 dist/index.html「按钮」CSS 分节，纯 CSS 无 JS，
      改动请双向同步（dist/index.html 为权威源）。
依赖：设计令牌子集（已内联，完整版见 tokens.css）。
特性：主/次两种变体，均无边框——主按钮强调色填充，次按钮中性填充；
      active 按压缩放 + 透明度反馈；图标随字号缩放（.btn .icon 固定 14px）。
用法：双击本文件即可在浏览器预览；移植时复制「组件 CSS」一段，
      按需组合 btn-primary / btn-secondary，图标可换成任意 14px SVG。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button 按钮 · 组件 demo</title>
    <style>
        /* ───── 设计令牌子集（拷贝自 tokens.css，勿单侧改动） ───── */
        :root {
            --bg: #fcfcfc;
            --card: #feffff;
            --hover: #e0e0e0;
            --accent: #005fb8;
            --accent-hover: #004a94;
            --on-accent: #ffffff;
            --text-primary: rgba(0, 0, 0, 0.87);
            --text-auxiliary: rgba(0, 0, 0, 0.52);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --duration-fast: 100ms;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 10px;
            --radius-sm: 6px;
            --font: "Noto Serif SC", "edit Han Serif SC", "SimSun", "宋体", serif;
        }
        [data-theme="dark"] {
            --bg: #202020;
            --card: #232323;
            --hover: #3d3d3d;
            --accent: #60cdff;
            --accent-hover: #8ad6ff;
            --on-accent: rgba(0, 0, 0, 0.87);
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-auxiliary: rgba(255, 255, 255, 0.4);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* ───── demo 页面骨架（非组件本体） ───── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow-card);
            max-width: 560px;
            margin: 0 auto 16px;
        }
        .card-title-sm { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
        .card-subtitle { font-size: 0.7rem; color: var(--text-auxiliary); margin-bottom: 8px; }
        .btn-row-demo { display: flex; gap: 8px; flex-wrap: wrap; }
        .theme-btn {
            display: block;
            margin: 0 auto;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: var(--font);
            cursor: pointer;
            border: none;
            background: var(--hover);
            color: var(--text-primary);
        }

        /* ═════════════════════ 组件 CSS：Button 按钮（拷贝自 dist/index.html） ═════════════════════ */
        .icon {
            width: 1em;
            height: 1em;
            flex-shrink: 0;
            vertical-align: -0.15em;
        }
        .btn .icon { width: 14px; height: 14px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 520;
            font-family: var(--font);
            cursor: pointer;
            border: none;
            transition: background var(--duration-fast) var(--ease), opacity var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease);
        }
        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-primary {
            background: var(--accent);
            color: var(--on-accent);
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: var(--hover);
            color: var(--text-primary);
        }
        .btn-secondary:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- ═════════ 组件 HTML：Button 按钮 ═════════ -->
    <div class="card">
        <h2 class="card-title-sm">Button 按钮</h2>
        <p class="card-subtitle">主/次两种变体：主按钮强调色填充，次按钮中性填充，均无边框</p>
        <p class="card-subtitle">纯文字</p>
        <div class="btn-row-demo">
            <button class="btn btn-primary">主按钮</button>
            <button class="btn btn-secondary">次按钮</button>
        </div>
        <p class="card-subtitle" style="margin-top:16px;">带图标（任意 14px SVG，currentColor 随文字变色）</p>
        <div class="btn-row-demo">
            <button class="btn btn-primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                带图标主按钮
            </button>
            <button class="btn btn-secondary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                带图标次按钮
            </button>
        </div>
    </div>

    <button class="theme-btn" id="themeBtn">切换深色</button>

    <script>
    /* ───── demo 绑定（非组件本体，组件本身纯 CSS） ───── */
    document.getElementById('themeBtn').addEventListener('click', () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
    });
    </script>
</body>
</html>
