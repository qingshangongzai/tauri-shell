<!--
═══════════ Tooltip — 自包含 demo ═══════════
来源：拷贝自 dist/index.html「UI 组件：Tooltip」CSS 分节（纯 CSS，无 JS），
      改动请双向同步（dist/index.html 为权威源）。
依赖：设计令牌子集（已内联，完整版见 tokens.css）；图标按钮示例另需 .icon 与 i-info symbol。
特性：hover / focus-visible（键盘聚焦）显示，深底浅字气泡随主题反转（--tip-* 组件级变量），
      150ms 延迟出现避免误触。
用法：双击本文件即可在浏览器预览；移植时复制「组件 CSS」一段，
      给任意元素加 class="tooltip" 与 data-tip="提示文字" 即可。
      注意宿主元素需能定位（position: relative 已由 .tooltip 提供），上方要留出气泡空间。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip · 组件 demo</title>
    <style>
        /* ───── 设计令牌子集（拷贝自 tokens.css，勿单侧改动） ───── */
        :root {
            --bg: #fcfcfc;
            --card: #feffff;
            --hover: #e0e0e0;
            --divider: #d9d9d9;
            --accent: #005fb8;
            --accent-hover: #004a94;
            --on-accent: #ffffff;
            --text-primary: rgba(0, 0, 0, 0.87);
            --text-body: rgba(0, 0, 0, 0.78);
            --text-auxiliary: rgba(0, 0, 0, 0.52);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --duration-fast: 100ms;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-flyout: 0 2px 8px rgba(0, 0, 0, 0.14);
            --radius: 10px;
            --radius-sm: 6px;
            --font: "Noto Serif SC", "Source Han Serif SC", "SimSun", "宋体", serif;
        }
        [data-theme="dark"] {
            --bg: #202020;
            --card: #232323;
            --hover: #3d3d3d;
            --divider: #454545;
            --accent: #60cdff;
            --accent-hover: #8ad6ff;
            --on-accent: rgba(0, 0, 0, 0.87);
            --text-primary: rgba(255, 255, 255, 0.87);
            --text-body: rgba(255, 255, 255, 0.6);
            --text-auxiliary: rgba(255, 255, 255, 0.4);
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-flyout: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* ───── demo 页面骨架（非组件本体） ───── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px;
        }
        .icon { width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.15em; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow-card);
            max-width: 560px;
            margin: 0 auto 16px;
        }
        .card-title-sm { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
        .card-subtitle { font-size: 0.7rem; color: var(--text-auxiliary); margin-bottom: 8px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 520;
            font-family: var(--font);
            cursor: pointer;
            border: none;
            transition: background var(--duration-fast) var(--ease), opacity var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease);
        }
        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-primary { background: var(--accent); color: var(--on-accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--hover); color: var(--text-primary); }
        .btn-secondary:hover { opacity: 0.8; }
        .theme-btn {
            display: block;
            margin: 0 auto;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: var(--font);
            cursor: pointer;
            border: none;
            background: var(--hover);
            color: var(--text-primary);
        }

        /* ═════════════════════ 组件 CSS：Tooltip（拷贝自 dist/index.html） ═════════════════════ */
        /* 组件级变量：气泡深底浅字与主题反转，不进共享设计令牌块 */
        .tooltip {
            --tip-bg: rgba(0, 0, 0, 0.78);
            --tip-text: #ffffff;
        }
        [data-theme="dark"] .tooltip {
            --tip-bg: rgba(255, 255, 255, 0.87);
            --tip-text: rgba(0, 0, 0, 0.87);
        }
        .tooltip { position: relative; }
        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(2px);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            background: var(--tip-bg);
            color: var(--tip-text);
            font-size: 0.7rem;
            font-weight: 450;
            line-height: 1.4;
            white-space: nowrap;
            box-shadow: var(--shadow-flyout);
            z-index: 10;
        }
        .tooltip::before {
            content: '';
            position: absolute;
            bottom: calc(100% + 3px);
            left: 50%;
            transform: translateX(-50%) translateY(2px);
            border: 5px solid transparent;
            border-top-color: var(--tip-bg);
            border-bottom: none;
            z-index: 10;
        }
        .tooltip::after, .tooltip::before {
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--duration-fast) var(--ease) 150ms, transform var(--duration-fast) var(--ease) 150ms;
        }
        .tooltip:hover::after, .tooltip:hover::before,
        .tooltip:focus-visible::after, .tooltip:focus-visible::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .tooltip-demo-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding-top: 24px; /* 给上方气泡留出弹出空间 */
        }
        .tooltip-icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: var(--hover);
            color: var(--text-body);
            cursor: pointer;
            padding: 0;
            transition: background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease);
        }
        .tooltip-icon-btn .icon { width: 14px; height: 14px; }
        .tooltip-icon-btn:hover { background: var(--divider); color: var(--text-primary); }

        /* ───── 动效降级 ───── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- 图标按钮示例依赖的 SVG symbol -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    </svg>

    <!-- ═════════ 组件 HTML：任意元素加 class="tooltip" + data-tip ═════════ -->
    <div class="card">
        <h2 class="card-title-sm">Tooltip</h2>
        <p class="card-subtitle">悬停或键盘聚焦时显示提示气泡，纯 CSS 实现</p>
        <div class="tooltip-demo-row">
            <button class="btn btn-primary tooltip" data-tip="保存当前更改（Ctrl+S）">保存</button>
            <button class="btn btn-secondary tooltip" data-tip="撤销上一步操作（Ctrl+Z）">撤销</button>
            <button class="tooltip-icon-btn tooltip" data-tip="查看帮助信息" aria-label="帮助">
                <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
            </button>
        </div>
    </div>

    <button class="theme-btn" id="themeBtn">切换深色</button>

    <script>
    /* ───── demo 绑定（非组件本体，组件本身纯 CSS） ───── */
    document.getElementById('themeBtn').addEventListener('click', () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
    });
    </script>
</body>
</html>
